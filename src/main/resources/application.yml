spring:
  application:
    name: library-svc

  # Loads a local, gitignored `.env` file — same mechanism as every other Aura service.
  config:
    import: "optional:file:.env[.properties]"

  # Same Supabase Postgres project as the other services, own schema (`library`) — always through
  # the Supavisor pooler (port 6543, transaction mode), never the direct connection.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      pool-name: library-svc-pool

  flyway:
    default-schema: library
    schemas: library
    locations: classpath:db/migration

  # Supabase Auth signs access tokens with the project's asymmetric key (ES256) and publishes it
  # as a JWKS — verification needs no shared secret.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_URL:https://feokdvpaexpvwpzpueot.supabase.co}/auth/v1/.well-known/jwks.json
          jws-algorithms: ES256
          audiences: authenticated

  # RestClient timeouts for calls to catalog-svc.
  http:
    client:
      connect-timeout: 3s
      read-timeout: 8s

server:
  port: ${PORT:8085}

aura:
  # Talks to catalog-svc directly (service-to-service), not through the gateway.
  catalog-client:
    base-url: ${CATALOG_SVC_URL:http://localhost:8081}
  library:
    max-playlists-per-user: 500
    max-tracks-per-playlist: 10000

resilience4j:
  circuitbreaker:
    instances:
      catalog:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
  # Resilience4j's own default TimeLimiter timeout is 1s — too tight once you count connection setup.
  timelimiter:
    instances:
      catalog:
        timeout-duration: 8s

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# Plain, readable console logging for local dev (IntelliJ, ./gradlew bootRun). Structured JSON logs
# live in application-prod.yml — activate with SPRING_PROFILES_ACTIVE=prod (Render deployment).
